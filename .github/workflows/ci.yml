name: ci

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test
      - run: npx -y @redocly/cli@1 lint openapi/openapi.yaml

  emu-test:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Ensure jq
        run: command -v jq >/dev/null || (sudo apt-get update && sudo apt-get install -y jq)
      - run: scripts/emu-test.sh

  build-push:
    runs-on: ubuntu-latest
    needs: [test, emu-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/arm64,linux/amd64
          push: true
          tags: |
            ghcr.io/silmin/cdj-music-link-server:latest
            ghcr.io/silmin/cdj-music-link-server:sha-${{ env.SHORT_SHA }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: fake-cdj/Dockerfile
          platforms: linux/arm64,linux/amd64
          push: true
          tags: |
            ghcr.io/silmin/cdj-music-link-fake-cdj:latest
            ghcr.io/silmin/cdj-music-link-fake-cdj:sha-${{ env.SHORT_SHA }}
          cache-from: type=gha,scope=fake-cdj
          cache-to: type=gha,mode=max,scope=fake-cdj
