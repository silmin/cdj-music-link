# Tag v* → GitHub Release with cdj-tui binaries (the server ships as a GHCR image from ci.yml).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  tui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tui/go.mod
          cache-dependency-path: tui/go.sum
      - name: Test
        run: cd tui && test -z "$(gofmt -l .)" && go vet ./... && go test ./...
      - name: Build
        working-directory: tui
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/arm64 linux/amd64 darwin/arm64 darwin/amd64; do
            os=${target%/*}; arch=${target#*/}
            name=cdj-tui_${GITHUB_REF_NAME}_${os}_${arch}
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "dist/$name/cdj-tui" ./cmd/cdj-tui
            cp README.md "dist/$name/README.md"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
            rm -r "dist/$name"
          done
          (cd dist && sha256sum *.tar.gz > checksums.txt && cat checksums.txt)
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          flags=()
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" tui/dist/*.tar.gz tui/dist/checksums.txt \
            --title "$GITHUB_REF_NAME" --generate-notes "${flags[@]}" \
            --notes "cdj-tui binaries (linux arm64/amd64, darwin arm64/amd64). Server image: ghcr.io/silmin/cdj-music-link-server"
